
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessories Adda Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; }
        header { background: #1e293b; padding: 20px; text-align: center; border-bottom: 2px solid #3b82f6; }
        header h1 { color: #38bdf8; font-size: 24px; }
        .banner { background: #1e293b; color: #10b981; text-align: center; padding: 10px; font-weight: bold; font-size: 14px; margin-bottom: 20px; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; flex: 1; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        
        .card { background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; display: flex; flex-direction: column; }
        .card img { width: 100%; height: 220px; object-fit: cover; }
        .card-body { padding: 15px; display: flex; flex-direction: column; flex: 1; }
        .card-title { font-size: 18px; margin-bottom: 8px; color: #f1f5f9; }
        .card-price { color: #38bdf8; font-size: 20px; font-weight: bold; margin-bottom: 12px; }
        .btn-group { margin-top: auto; display: flex; gap: 8px; }
        
        button { border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #475569; color: #fff; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
        .modal-content { background: #1e293b; max-width: 500px; width: 100%; border-radius: 12px; padding: 20px; max-height: 90vh; overflow-y: auto; }
        .gallery { display: flex; gap: 8px; overflow-x: auto; margin: 10px 0; }
        .gallery img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
        .gallery img.active { border-color: #38bdf8; }
        
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; }
        footer { background: #020617; padding: 20px; text-align: center; margin-top: 40px; border-top: 1px solid #1e293b; }
        footer a { color: #94a3b8; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <h1>Accessories Adda Hub</h1>
    </header>
    <div class="banner">🚚 ক্যাশ অন ডেলিভারি — পণ্য হাতে পেয়ে দেখে টাকা দিন!</div>

    <div class="container">
        <h2 style="margin-bottom: 15px;">সকল ঘড়ি ও কালেকশন</h2>
        <div id="productGrid" class="grid">
            <p>লোড হচ্ছে...</p>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle"></h3>
            <img id="mainModalImg" src="" style="width: 100%; height: 250px; object-fit: cover; border-radius: 8px; margin-top: 10px;">
            <div id="thumbGallery" class="gallery"></div>
            <p id="modalPrice" style="color: #38bdf8; font-size: 20px; font-weight: bold;"></p>
            <p id="modalDesc" style="margin: 10px 0; color: #cbd5e1; white-space: pre-line;"></p>
            <button class="btn-primary" onclick="openOrderFromDetails()">অর্ডার করুন</button>
            <button class="btn-secondary" onclick="closeModal('detailsModal')" style="margin-top: 8px;">বন্ধ করুন</button>
        </div>
    </div>

    <!-- Order Modal -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h3>ক্যাশ অন ডেলিভারি অর্ডার</h3>
            <p id="orderProductTitle" style="color: #38bdf8; margin: 5px 0;"></p>
            <form id="orderForm">
                <input type="text" id="custName" placeholder="আপনার নাম" required>
                <input type="tel" id="custPhone" placeholder="মোবাইল নম্বর" required>
                <textarea id="custAddr" placeholder="সম্পূর্ণ ঠিকানা" rows="3" required></textarea>
                <button type="submit" class="btn-primary">অর্ডার কনফার্ম করুন</button>
                <button type="button" class="btn-secondary" onclick="closeModal('orderModal')" style="margin-top: 8px;">ক্যানসেল</button>
            </form>
        </div>
    </div>

    <footer>
        <a href="admin.html">⚙️ Admin Panel Log In</a>
    </footer>

    <script>
        let currentProducts = [];
        let selectedProduct = null;

        async function fetchProducts() {
            try {
                const res = await fetch('/products');
                currentProducts = await res.json();
                const grid = document.getElementById('productGrid');
                
                if (currentProducts.length === 0) {
                    grid.innerHTML = '<p>বর্তমানে কোনো ঘড়ি যুক্ত নেই।</p>';
                    return;
                }

                grid.innerHTML = currentProducts.map((p, index) => `
                    <div class="card">
                        <img src="${p.images[0] || 'https://via.placeholder.com/300'}" alt="${p.title}">
                        <div class="card-body">
                            <div class="card-title">${p.title}</div>
                            <div class="card-price">৳ ${p.price}</div>
                            <div class="btn-group">
                                <button class="btn-secondary" onclick="showDetails(${index})">বিস্তারিত</button>
                                <button class="btn-primary" onclick="openOrderDirect(${index})">অর্ডার</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('productGrid').innerHTML = '<p>সার্ভার লোড হতে সমস্যা হচ্ছে।</p>';
            }
        }

        function showDetails(index) {
            selectedProduct = currentProducts[index];
            document.getElementById('modalTitle').innerText = selectedProduct.title;
            document.getElementById('modalPrice').innerText = `৳ ${selectedProduct.price}`;
            document.getElementById('modalDesc').innerText = selectedProduct.description || 'কোনো বিবরণ নেই।';
            
            const mainImg = document.getElementById('mainModalImg');
            mainImg.src = selectedProduct.images[0] || 'https://via.placeholder.com/300';

            const gallery = document.getElementById('thumbGallery');
            gallery.innerHTML = (selectedProduct.images || []).map((imgUrl, i) => `
                <img src="${imgUrl}" class="${i===0?'active':''}" onclick="changeMainImg('${imgUrl}', this)">
            `).join('');

            document.getElementById('detailsModal').style.display = 'flex';
        }

        function changeMainImg(url, el) {
            document.getElementById('mainModalImg').src = url;
            document.querySelectorAll('#thumbGallery img').forEach(img => img.classList.remove('active'));
            el.classList.add('active');
        }

        function openOrderDirect(index) {
            selectedProduct = currentProducts[index];
            openOrderFromDetails();
        }

        function openOrderFromDetails() {
            closeModal('detailsModal');
            document.getElementById('orderProductTitle').innerText = `${selectedProduct.title} — ৳ ${selectedProduct.price}`;
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const orderData = {
                customerName: document.getElementById('custName').value,
                phone: document.getElementById('custPhone').value,
                address: document.getElementById('custAddr').value,
                productTitle: selectedProduct.title,
                productPrice: selectedProduct.price
            };

            const res = await fetch('/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            });

            if (res.ok) {
                alert('অর্ডার সফলভাবে গ্রহণ করা হয়েছে!');
                closeModal('orderModal');
                document.getElementById('orderForm').reset();
            } else {
                alert('অর্ডার করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।');
            }
        });

        fetchProducts();
    </script>
</body>
</html>
