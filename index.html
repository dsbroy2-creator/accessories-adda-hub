<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Panel - Accessories Adda Hub</title>
  <style>
    body{font-family:Arial, sans-serif;margin:0;background:#f5f5f5}
    .top{background:#111;color:#fff;padding:16px}
    .wrap{max-width:1150px;margin:auto;padding:18px}
    .panel,.card{background:#fff;padding:16px;border-radius:12px;margin:12px 0;box-shadow:0 2px 6px rgba(0,0,0,0.05)}
    input,textarea,select{width:100%;padding:10px;margin:6px 0 12px;box-sizing:border-box;border:1px solid #ccc;border-radius:6px}
    button{padding:8px 14px;border:0;border-radius:6px;background:#111;color:#fff;cursor:pointer;font-weight:bold;margin:4px 2px}
    .gold{background:#c9a227;color:#111}
    .btn-accept{background:#27ae60;color:#fff}
    .btn-ship{background:#2980b9;color:#fff}
    .btn-deliver{background:#8e44ad;color:#fff}
    .btn-cancel{background:#e67e22;color:#fff}
    .btn-delete{background:#c0392b;color:#fff}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}
    .thumb{width:100%;height:160px;object-fit:contain;background:#eee;border-radius:8px}
    .order{border-left:6px solid #c9a227}
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: bold; display: inline-block; }
    .badge-Pending { background: #fff3cd; color: #856404; }
    .badge-Accepted { background: #d4edda; color: #155724; }
    .badge-Shipped { background: #cce5ff; color: #004085; }
    .badge-Delivered { background: #d1ecf1; color: #0c5460; }
    .badge-Cancelled { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <div class="top"><h2>Accessories Adda Hub — Admin Panel</h2></div>
  <div class="wrap">
    <div id="login" class="panel">
      <h3>Admin Login</h3>
      <input id="pass" type="password" placeholder="Admin password">
      <button onclick="login()">Login</button>
    </div>

    <div id="app" style="display:none">
      <div class="panel" style="display:flex; justify-content:space-between; align-items:center;">
        <b>Welcome Admin</b>
        <button onclick="logout()" style="background:#ff4d4d;">Logout</button>
      </div>

      <!-- Settings & Logo Upload Section -->
      <div class="panel">
        <h3>Store & Payment Settings</h3>
        <label><b>Website Logo (ওয়েবসাইটের লোগো আপলোড/পরিবর্তন করুন):</b></label>
        <input id="logoFile" type="file" accept="image/*">
        <div id="logoPreviewWrap" style="margin-bottom:10px; display:none;">
          <p style="margin:2px 0; font-size:12px; color:#666;">বর্তমান লোগো:</p>
          <img id="logoPreview" src="" style="max-height:70px; border:1px solid #ccc; border-radius:6px; padding:4px; background:#fff;">
        </div>

        <label><b>Tagline:</b></label>
        <input id="tag" placeholder="Tagline">
        <label><b>Delivery Text:</b></label>
        <textarea id="del" placeholder="Delivery text"></textarea>
        <label><b>WhatsApp / Contact Phone:</b></label>
        <input id="wa" placeholder="WhatsApp Number">
        <label><b>bKash Merchant/Personal Number:</b></label>
        <input id="bk" placeholder="bKash Number">
        <label><b>Nagad Merchant/Personal Number:</b></label>
        <input id="ng" placeholder="Nagad Number">
        <button class="gold" onclick="saveSettings()">Save Settings & Logo</button>
      </div>

      <!-- New Product Section -->
      <div class="panel">
        <h3>New Product</h3>
        <input id="nn" placeholder="Product name">
        <input id="np" type="number" placeholder="Price (৳)">
        <textarea id="nd" placeholder="Description"></textarea>
        <input id="ni" type="file" accept="image/*">
        <button class="gold" onclick="addProduct()">Add Product</button>
      </div>

      <h3>Products List</h3>
      <div id="plist" class="grid"></div>

      <!-- Orders List Section -->
      <h3 style="margin-top: 30px;">Orders List (অর্ডারসমূহ)</h3>
      <div id="olist"></div>
    </div>
  </div>

  <script>
    let token = localStorage.adminToken || "";
    let currentSettings = {};

    function esc(s){ return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

    async function api(u, o = {}) {
      o.headers = { ...(o.headers || {}), "x-admin-token": token };
      let r = await fetch(u, o);
      if (r.status === 401) { logout(); throw Error("Unauthorized"); }
      return r;
    }

    async function login() {
      let r = await fetch("/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pass.value })
      });
      let d = await r.json();
      if (!r.ok) return alert("Wrong password");
      token = d.token;
      localStorage.adminToken = token;
      show();
    }

    function logout() {
      localStorage.removeItem("adminToken");
      location.reload();
    }

    async function show() {
      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";
      
      currentSettings = await fetch("/api/settings").then(r => r.json());
      tag.value = currentSettings.tagline || "";
      del.value = currentSettings.deliveryText || "";
      wa.value = currentSettings.whatsapp || "";
      bk.value = currentSettings.bkash || "";
      ng.value = currentSettings.nagad || "";
      
      if(currentSettings.logo) {
        document.getElementById("logoPreview").src = currentSettings.logo;
        document.getElementById("logoPreviewWrap").style.display = "block";
      } else {
        document.getElementById("logoPreviewWrap").style.display = "none";
      }

      loadP();
      loadO();
    }

    async function saveSettings() {
      let logoUrl = currentSettings.logo || "";
      let lf = document.getElementById("logoFile").files[0];
      if (lf) {
        logoUrl = await upload(lf);
      }

      await api("/api/admin/settings", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 
          tagline: tag.value, 
          deliveryText: del.value, 
          whatsapp: wa.value, 
          bkash: bk.value, 
          nagad: ng.value,
          logo: logoUrl
        })
      });
      alert("Settings & Logo saved successfully!");
      show();
    }

    async function upload(f) {
      let x = new FormData();
      x.append("image", f);
      return (await (await api("/api/admin/upload", { method: "POST", body: x })).json()).url;
    }

    async function loadP() {
      let a = await api("/api/admin/products").then(r => r.json());
      plist.innerHTML = a.map(p => `<div class="card"><img class="thumb" src="${p.image || ''}"><input id="n${p.id}" value="${esc(p.name)}"><input id="p${p.id}" type="number" value="${p.price}"><textarea id="d${p.id}">${esc(p.description)}</textarea><input id="i${p.id}" type="file" accept="image/*"><label><input id="s${p.id}" type="checkbox" ${p.stock ? "checked" : ""}> Available</label><div style="margin-top:10px;"><button class="gold" onclick="saveP('${p.id}')">Save</button> <button onclick="delP('${p.id}')" style="background:#ff4d4d;">Delete</button></div></div>`).join("");
    }

    async function saveP(id) {
      let f = document.getElementById("i" + id).files[0];
      let body = {
        name: document.getElementById("n" + id).value,
        price: document.getElementById("p" + id).value,
        description: document.getElementById("d" + id).value,
        stock: document.getElementById("s" + id).checked
      };
      if (f) body.image = await upload(f);
      await api("/api/admin/products/" + id, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      alert("Product updated!");
      loadP();
    }

    async function addProduct() {
      let u = ni.files[0] ? await upload(ni.files[0]) : "";
      await api("/api/admin/products", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: nn.value, price: np.value, description: nd.value, image: u }) });
      nn.value = np.value = nd.value = "";
      ni.value = "";
      alert("Product added!");
      loadP();
    }

    async function delP(id) {
      if (confirm("Delete product?")) {
        await api("/api/admin/products/" + id, { method: "DELETE" });
        loadP();
      }
    }

    /* Orders Management */
    async function loadO() {
      let a = await api("/api/admin/orders").then(r => r.json());
      olist.innerHTML = a.length ? a.map(o => {
        let itemsHtml = (o.items || []).map(i => `<li><b>${esc(i.name)}</b> — ৳${i.price}</li>`).join("");
        let total = (o.items || []).reduce((sum, i) => sum + Number(i.price || 0), 0);
        let status = o.status || "Pending";
        let cust = o.customer || {};

        let payInfo = `<br><b>পেমেন্ট পদ্ধতি:</b> ${esc(cust.payMethod || 'Cash on Delivery')}`;
        if(cust.senderPhone) payInfo += ` | <b>প্রেরক নম্বর:</b> ${esc(cust.senderPhone)}`;
        if(cust.trxId) payInfo += ` | <b>TrxID:</b> ${esc(cust.trxId)}`;

        return `<div class="card order" style="text-align: left;">
          <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding-bottom:8px; margin-bottom:8px;">
            <div>
              <b>Order ID: ${o.id}</b>
              <span class="badge badge-${status}" style="margin-left:8px;">${status}</span>
            </div>
            <span style="font-size:12px; color:#666;">${o.id.split('_')[1] ? new Date(Number(o.id.split('_')[1])).toLocaleString('bn-BD') : ''}</span>
          </div>
          
          <p style="margin: 5px 0; line-height: 1.5;">
            <b>গ্রাহকের নাম:</b> ${esc(cust.name)}<br>
            <b>ফোন নম্বর:</b> 📞 <a href="tel:${esc(cust.phone)}">${esc(cust.phone)}</a><br>
            <b>ঠিকানা:</b> 📍 ${esc(cust.address)}
            ${payInfo}
          </p>

          <div style="background: #f9f9f9; padding: 10px; border-radius: 8px; margin: 10px 0; border: 1px solid #eee;">
            <b>অর্ডারকৃত পণ্যসমূহ:</b>
            <ul style="margin: 6px 0; padding-left: 20px;">${itemsHtml}</ul>
            <p style="margin: 8px 0 0; font-size: 16px; color: #c9a227; font-weight: bold;">মোট মূল্য: ৳${total}</p>
          </div>

          <!-- Order Status Action Buttons -->
          <div style="margin-top: 12px; border-top: 1px dashed #ddd; padding-top: 10px;">
            <b>অর্ডার অ্যাকশন:</b><br>
            <button class="btn-accept" onclick="updateOrderStatus('${o.id}', 'Accepted')">✅ একসেপ্ট করুন</button>
            <button class="btn-ship" onclick="updateOrderStatus('${o.id}', 'Shipped')">🚚 ডেলিভারিতে পাঠান</button>
            <button class="btn-deliver" onclick="updateOrderStatus('${o.id}', 'Delivered')">🎉 ডেলিভারি সম্পন্ন</button>
            <button class="btn-cancel" onclick="updateOrderStatus('${o.id}', 'Cancelled')">❌ বাতিল করুন</button>
            <button class="btn-delete" onclick="deleteOrder('${o.id}')">🗑️️ মুছে ফেলুন</button>
          </div>
        </div>`;
      }).join("") : "<p>এখনো কোনো অর্ডার পাওয়া যায়নি।</p>";
    }

    async function updateOrderStatus(id, status) {
      await api("/api/admin/orders/" + id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status })
      });
      alert("অর্ডার স্ট্যাটাস পারিবর্তন করা হয়েছে: " + status);
      loadO();
    }

    async function deleteOrder(id) {
      if(confirm("আপনি কি নিশ্চিত এই অর্ডারটি মুছে ফেলতে চান?")) {
        await api("/api/admin/orders/" + id, { method: "DELETE" });
        alert("অর্ডারটি সফলভাবে মুছে ফেলা হয়েছে!");
        loadO();
      }
    }

    if (token) show();
  </script>
</body>
</html>
