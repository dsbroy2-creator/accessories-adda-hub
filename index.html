
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessories Adda Hub | Premium Watch Collection</title>
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-card: #151f32;
            --accent-gold: #f59e0b;
            --accent-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        header { background: #111827; border-bottom: 1px solid var(--border-color); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo-img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-gold); }
        .brand-name { font-size: 22px; font-weight: 700; color: #fff; }
        .brand-name span { color: var(--accent-gold); }

        .top-notice { background: linear-gradient(90deg, #1e1b4b, #311b92); color: #e0e7ff; text-align: center; padding: 10px; font-size: 14px; font-weight: 600; border-bottom: 1px solid #4338ca; }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; flex: 1; width: 100%; }
        .section-title { font-size: 24px; font-weight: 700; margin-bottom: 25px; color: #fff; border-left: 4px solid var(--accent-gold); padding-left: 12px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        .card { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; display: flex; flex-direction: column; transition: 0.2s; }
        .card:hover { transform: translateY(-5px); border-color: var(--accent-cyan); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .card-img-wrap { width: 100%; height: 240px; background: #000; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 18px; display: flex; flex-direction: column; flex: 1; }
        .card-title { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 8px; }
        .card-price { font-size: 20px; font-weight: 700; color: var(--accent-gold); margin-bottom: 15px; }
        
        .btn-group { display: flex; gap: 10px; margin-top: auto; }
        button { border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; font-size: 14px; transition: 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); }
        .btn-outline:hover { background: #1e293b; color: #fff; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; width: 100%; max-width: 520px; padding: 25px; max-height: 90vh; overflow-y: auto; color: #fff; }
        .gallery-thumbs { display: flex; gap: 10px; overflow-x: auto; margin: 12px 0; padding-bottom: 5px; }
        .gallery-thumbs img { width: 65px; height: 65px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
        .gallery-thumbs img.active { border-color: var(--accent-gold); }

        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0 16px; background: #0b0f19; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        input:focus, textarea:focus, select:focus { border-color: var(--accent-cyan); }

        .price-summary { background: #0b0f19; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 15px; font-size: 14px; }
        .price-row { display: flex; justify-content: space-between; margin-bottom: 6px; color: var(--text-muted); }
        .price-row.total { color: var(--accent-gold); font-weight: bold; font-size: 16px; border-top: 1px solid var(--border-color); padding-top: 6px; margin-bottom: 0; }

        footer { background: #030712; padding: 25px; text-align: center; border-top: 1px solid var(--border-color); margin-top: auto; }
        footer a { color: var(--text-muted); text-decoration: none; font-size: 13px; }
        footer a:hover { color: var(--accent-gold); }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img class="logo-img" src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=100" alt="Logo">
            <div class="brand-name">Accessories Adda <span>Hub</span></div>
        </div>
    </header>

    <div class="top-notice">🚚 ক্যাশ অন ডেলিভারি — সারা বাংলাদেশে দেখে মূল্য পরিশোধের সুবিধা!</div>

    <div class="container">
        <div class="section-title">সর্বশেষ ঘড়ির কালেকশন</div>
        <div id="productGrid" class="grid">
            <p style="color: var(--text-muted);">পণ্য লোড হচ্ছে...</p>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle" style="font-size: 20px;"></h2>
            <img id="mainModalImg" src="" style="width: 100%; height: 260px; object-fit: cover; border-radius: 10px; margin-top: 12px;">
            <div id="thumbGallery" class="gallery-thumbs"></div>
            <div id="modalPrice" style="font-size: 22px; font-weight: bold; color: var(--accent-gold); margin: 10px 0;"></div>
            <p id="modalDesc" style="color: var(--text-muted); font-size: 14px; line-height: 1.6; white-space: pre-line; margin-bottom: 20px;"></p>
            <button class="btn-primary" onclick="openOrderFromDetails()">অর্ডার করুন</button>
            <button class="btn-outline" onclick="closeModal('detailsModal')" style="margin-top: 10px;">বন্ধ করুন</button>
        </div>
    </div>

    <!-- Order Modal -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h2 style="font-size: 20px; margin-bottom: 5px;">ক্যাশ অন ডেলিভারি অর্ডার</h2>
            <p id="orderProductTitle" style="color: var(--accent-cyan); font-weight: 600; margin-bottom: 15px;"></p>
            
            <form id="orderForm">
                <label style="font-size: 13px; color: var(--text-muted);">আপনার নাম:</label>
                <input type="text" id="custName" placeholder="সম্পূর্ণ নাম লিখুন" required>
                
                <label style="font-size: 13px; color: var(--text-muted);">মোবাইল নম্বর:</label>
                <input type="tel" id="custPhone" placeholder="১১ ডিজিটের মোবাইল নম্বর" required>

                <label style="font-size: 13px; color: var(--text-muted);">ডেলিভারি এলাকা:</label>
                <select id="deliverySelect" onchange="updateTotalCost()" required>
                </select>
                
                <label style="font-size: 13px; color: var(--text-muted);">সম্পূর্ণ ঠিকানা:</label>
                <textarea id="custAddr" placeholder="জেলা, থানা ও এলাকার নাম লিখুন" rows="2" required></textarea>

                <div class="price-summary">
                    <div class="price-row"><span>পণ্যের দাম:</span> <span>৳ <span id="summaryProductPrice">0</span></span></div>
                    <div class="price-row"><span>ডেলিভারি চার্জ:</span> <span>৳ <span id="summaryDeliveryCharge">0</span></span></div>
                    <div class="price-row total"><span>সর্বমোট বিল:</span> <span>৳ <span id="summaryTotalPrice">0</span></span></div>
                </div>
                
                <button type="submit" class="btn-primary">অর্ডার কনফার্ম করুন</button>
                <button type="button" class="btn-outline" onclick="closeModal('orderModal')" style="margin-top: 10px;">ক্যানসেল</button>
            </form>
        </div>
    </div>

    <footer>
        <p style="margin-bottom: 8px; color: var(--text-muted); font-size: 13px;">© Accessories Adda Hub. All rights reserved.</p>
        <a href="admin.html">⚙️ Admin Control Panel</a>
    </footer>

    <script>
        let currentProducts = [];
        let selectedProduct = null;
        let deliverySettings = { insideDhaka: 80, outsideDhaka: 150 };

        async function init() {
            try {
                const sRes = await fetch('/settings');
                deliverySettings = await sRes.json();
            } catch(e) {}
            fetchProducts();
        }

        async function fetchProducts() {
            try {
                const res = await fetch('/products');
                currentProducts = await res.json();
                const grid = document.getElementById('productGrid');
                
                if (!currentProducts.length) {
                    grid.innerHTML = '<p style="color: var(--text-muted);">বর্তমানে কোনো ঘড়ি যুক্ত নেই।</p>';
                    return;
                }

                grid.innerHTML = currentProducts.map((p, index) => `
                    <div class="card">
                        <div class="card-img-wrap">
                            <img class="card-img" src="${(p.images && p.images[0]) || 'https://via.placeholder.com/300'}" alt="${p.title}">
                        </div>
                        <div class="card-body">
                            <div class="card-title">${p.title}</div>
                            <div class="card-price">৳ ${p.price}</div>
                            <div class="btn-group">
                                <button class="btn-outline" onclick="showDetails(${index})">বিস্তারিত</button>
                                <button class="btn-primary" onclick="openOrderDirect(${index})">অর্ডার</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('productGrid').innerHTML = '<p style="color: #ef4444;">সার্ভার সমস্যা।</p>';
            }
        }

        function showDetails(index) {
            selectedProduct = currentProducts[index];
            document.getElementById('modalTitle').innerText = selectedProduct.title;
            document.getElementById('modalPrice').innerText = `৳ ${selectedProduct.price}`;
            document.getElementById('modalDesc').innerText = selectedProduct.description || 'কোনো বিবরণ দেওয়া হয়নি।';
            
            document.getElementById('mainModalImg').src = (selectedProduct.images && selectedProduct.images[0]) || 'https://via.placeholder.com/300';
            document.getElementById('thumbGallery').innerHTML = (selectedProduct.images || []).map((imgUrl, i) => `
                <img src="${imgUrl}" class="${i===0?'active':''}" onclick="changeMainImg('${imgUrl}', this)">
            `).join('');

            document.getElementById('detailsModal').style.display = 'flex';
        }

        function changeMainImg(url, el) {
            document.getElementById('mainModalImg').src = url;
            document.querySelectorAll('#thumbGallery img').forEach(img => img.classList.remove('active'));
            el.classList.add('active');
        }

        function openOrderDirect(index) {
            selectedProduct = currentProducts[index];
            openOrderFromDetails();
        }

        function openOrderFromDetails() {
            closeModal('detailsModal');
            document.getElementById('orderProductTitle').innerText = `${selectedProduct.title}`;
            
            const select = document.getElementById('deliverySelect');
            select.innerHTML = `
                <option value="inside">ঢাকার ভেতরে (৳ ${deliverySettings.insideDhaka})</option>
                <option value="outside">ঢাকার বাইরে (৳ ${deliverySettings.outsideDhaka})</option>
            `;

            updateTotalCost();
            document.getElementById('orderModal').style.display = 'flex';
        }

        function updateTotalCost() {
            const area = document.getElementById('deliverySelect').value;
            const charge = area === 'inside' ? deliverySettings.insideDhaka : deliverySettings.outsideDhaka;
            const total = Number(selectedProduct.price) + Number(charge);

            document.getElementById('summaryProductPrice').innerText = selectedProduct.price;
            document.getElementById('summaryDeliveryCharge').innerText = charge;
            document.getElementById('summaryTotalPrice').innerText = total;
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const area = document.getElementById('deliverySelect').value;
            const charge = area === 'inside' ? deliverySettings.insideDhaka : deliverySettings.outsideDhaka;

            const orderData = {
                customerName: document.getElementById('custName').value,
                phone: document.getElementById('custPhone').value,
                address: document.getElementById('custAddr').value,
                deliveryArea: area === 'inside' ? 'ঢাকার ভেতরে' : 'ঢাকার বাইরে',
                deliveryCharge: charge,
                productTitle: selectedProduct.title,
                productPrice: selectedProduct.price,
                totalPrice: Number(selectedProduct.price) + Number(charge)
            };

            const res = await fetch('/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            });

            if (res.ok) {
                alert('আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে!');
                closeModal('orderModal');
                document.getElementById('orderForm').reset();
            } else {
                alert('অর্ডার করতে সমস্যা হয়েছে।');
            }
        });

        init();
    </script>
</body>
</html>
