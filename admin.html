<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Accessories Adda Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1, h2 { color: #38bdf8; margin-bottom: 15px; }
        .box { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #334155; }
        input, textarea { width: 100%; padding: 10px; margin: 6px 0 12px 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 4px; }
        button { background: #2563eb; color: #fff; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-danger { background: #ef4444; width: auto; padding: 6px 12px; font-size: 12px; }
        .item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>⚙️ এডমিন ড্যাশবোর্ড</h1>

    <!-- Add Product Form -->
    <div class="box">
        <h2>নতুন পণ্য যোগ করুন (সর্বোচ্চ ৬টি ছবি)</h2>
        <form id="addProductForm">
            <label>পণ্যের নাম:</label>
            <input type="text" id="title" required>

            <label>মূল্য (টাকায়):</label>
            <input type="number" id="price" required>

            <label>ছবি ১ এর লিংক (মেইন ছবি):</label>
            <input type="url" id="img1" required>

            <label>ছবি ২ এর লিংক (ঐচ্ছিক):</label>
            <input type="url" id="img2">

            <label>ছবি ৩ এর লিংক (ঐচ্ছিক):</label>
            <input type="url" id="img3">

            <label>ছবি ৪ এর লিংক (ঐচ্ছিক):</label>
            <input type="url" id="img4">

            <label>ছবি ৫ এর লিংক (ঐচ্ছিক):</label>
            <input type="url" id="img5">

            <label>ছবি ৬ এর লিংক (ঐচ্ছিক):</label>
            <input type="url" id="img6">

            <label>বিস্তারিত বিবরণী:</label>
            <textarea id="description" rows="4"></textarea>

            <button type="submit">পণ্য সফলভাবে এড করুন</button>
        </form>
    </div>

    <!-- Product List -->
    <div class="box">
        <h2>বিদ্যমান পণ্যসমূহ</h2>
        <div id="productList">লোড হচ্ছে...</div>
    </div>

    <!-- Orders List -->
    <div class="box">
        <h2>গ্রাহকদের অর্ডারসমূহ</h2>
        <div id="orderList">লোড হচ্ছে...</div>
    </div>
</div>

<script>
    async function loadAdminData() {
        // Load Products
        const pRes = await fetch('/products');
        const products = await pRes.json();
        document.getElementById('productList').innerHTML = products.map(p => `
            <div class="item">
                <div>
                    <strong>${p.title}</strong> — ৳ ${p.price} (${p.images.length}টি ছবি)
                </div>
                <button class="btn-danger" onclick="deleteProduct('${p._id}')">ডিলিট</button>
            </div>
        `).join('') || 'কোনো পণ্য নেই।';

        // Load Orders
        const oRes = await fetch('/orders');
        const orders = await oRes.json();
        document.getElementById('orderList').innerHTML = orders.map(o => `
            <div style="border-bottom: 1px solid #334155; padding: 10px 0;">
                <p><strong>গ্রাহক:</strong> ${o.customerName} (${o.phone})</p>
                <p><strong>পণ্য:</strong> ${o.productTitle} — ৳ ${o.productPrice}</p>
                <p><strong>ঠিকানা:</strong> ${o.address}</p>
            </div>
        `).join('') || 'কোনো অর্ডার নেই।';
    }

    document.getElementById('addProductForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const images = [
            document.getElementById('img1').value,
            document.getElementById('img2').value,
            document.getElementById('img3').value,
            document.getElementById('img4').value,
            document.getElementById('img5').value,
            document.getElementById('img6').value
        ].filter(url => url.trim() !== '');

        const productData = {
            title: document.getElementById('title').value,
            price: document.getElementById('price').value,
            images: images,
            description: document.getElementById('description').value
        };

        const res = await fetch('/products', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(productData)
        });

        if (res.ok) {
            alert('পণ্য সফলভাবে যুক্ত হয়েছে!');
            document.getElementById('addProductForm').reset();
            loadAdminData();
        }
    });

    async function deleteProduct(id) {
        if (confirm('আপনি কি এই পণ্যটি ডিলিট করতে চান?')) {
            await fetch(`/products/${id}`, { method: 'DELETE' });
            loadAdminData();
        }
    }

    loadAdminData();
</script>
</body>
</html>
