<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessories Adda Hub - Professional Admin Dashboard</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #f8fafc; --primary: #3b82f6; --danger: #ef4444; }
        body { background: var(--bg); color: var(--text); padding: 15px; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; }
        .container { max-width: 950px; margin: 0 auto; display: none; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1, h2 { color: #38bdf8; margin-top: 0; }
        label { display: block; margin-top: 10px; font-weight: 600; font-size: 14px; color: #cbd5e1; }
        input, textarea, select { width: 100%; padding: 12px; margin-top: 5px; background: #0b0f19; border: 1px solid var(--border); color: #fff; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button { background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; margin-top: 15px; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        
        /* ৫টি ছবির প্রিমিয়াম গ্রিড ডিজাইন */
        .img-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 10px; }
        .img-item { background: #0b0f19; border: 2px dashed var(--primary); padding: 12px; text-align: center; border-radius: 8px; }
        .img-item input { display: none; }
        .img-item label { color: #38bdf8; cursor: pointer; display: block; font-size: 13px; font-weight: bold; margin: 0; }
        .preview { width: 100%; height: 80px; object-fit: cover; display: none; margin-top: 8px; border-radius: 6px; border: 1px solid var(--border); }
        
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }
        
        .list-item { background: #0b0f19; padding: 12px 15px; margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .del-btn { background: var(--danger); width: auto; padding: 8px 14px; font-size: 13px; margin: 0; }
    </style>
</head>
<body>
    <div class="container" id="adminContainer">
        <h1>🚀 Accessories Adda Hub - Admin Panel</h1>
        
        <!-- ডেলিভারি চার্জ কন্ট্রোল -->
        <div class="card">
            <h2>🚚 ডেলিভারি চার্জ ম্যানেজমেন্ট</h2>
            <form id="settingsForm">
                <div class="row">
                    <div class="col">
                        <label>ঢাকার ভেতরে (৳):</label>
                        <input type="number" id="insideDhaka" required>
                    </div>
                    <div class="col">
                        <label>ঢাকার বাইরে (৳):</label>
                        <input type="number" id="outsideDhaka" required>
                    </div>
                </div>
                <button type="submit">চার্জ আপডেট করুন</button>
            </form>
        </div>

        <!-- প্রফেশনাল প্রোডাক্ট আপলোড (৫টি ছবি বক্সসহ) -->
        <div class="card">
            <h2>📦 নতুন পণ্য যুক্ত করুন (৫টি ছবির বক্স)</h2>
            <form id="addProductForm">
                <label>পণ্যের নাম:</label>
                <input type="text" id="title" placeholder="যেমন: Wireless Earbuds" required>
                
                <div class="row">
                    <div class="col">
                        <label>বর্তমান দাম (৳):</label>
                        <input type="number" id="price" placeholder="1200" required>
                    </div>
                    <div class="col">
                        <label>পূর্বের দাম (কাট মার্ক):</label>
                        <input type="number" id="oldPrice" placeholder="1500">
                    </div>
                </div>

                <label>পণ্যের ক্যাটাগরি:</label>
                <input type="text" id="category" placeholder="যেমন: Smartwatch / Headphone">

                <label>৫টি আলাদা ছবির বক্স (কমপক্ষে ১টি বাধ্যতামূলক):</label>
                <div class="img-grid">
                    <div class="img-item"><label for="img1">📷 ছবি ১</label><input type="file" id="img1" accept="image/*" onchange="previewImg(this, 'pr1')"><img id="pr1" class="preview"></div>
                    <div class="img-item"><label for="img2">📷 ছবি ২</label><input type="file" id="img2" accept="image/*" onchange="previewImg(this, 'pr2')"><img id="pr2" class="preview"></div>
                    <div class="img-item"><label for="img3">📷 ছবি ৩</label><input type="file" id="img3" accept="image/*" onchange="previewImg(this, 'pr3')"><img id="pr3" class="preview"></div>
                    <div class="img-item"><label for="img4">📷 ছবি ৪</label><input type="file" id="img4" accept="image/*" onchange="previewImg(this, 'pr4')"><img id="pr4" class="preview"></div>
                    <div class="img-item"><label for="img5">📷 ছবি ৫</label><input type="file" id="img5" accept="image/*" onchange="previewImg(this, 'pr5')"><img id="pr5" class="preview"></div>
                </div>

                <label>স্ট্যাটাস:</label>
                <select id="stockStatus">
                    <option value="In Stock">In Stock (স্টকে আছে)</option>
                    <option value="Stock Out">Stock Out (স্টক শেষ)</option>
                </select>
                
                <label>পণ্যের বিস্তারিত বিবরণ:</label>
                <textarea id="description" rows="3" placeholder="পণ্যের গুণাগুণ ও বিবরণ এখানে লিখুন..."></textarea>
                
                <button type="submit">প্রোডাক্ট ডাটাবেজে সেভ করুন</button>
            </form>
        </div>

        <!-- পণ্যের তালিকা -->
        <div class="card">
            <h2>📋 সকল পণ্যের তালিকা</h2>
            <div id="productList">তথ্য লোড হচ্ছে...</div>
        </div>
        
        <!-- অর্ডার লিস্ট -->
        <div class="card">
            <h2>🛍️ গ্রাহকদের অর্ডারসমূহ</h2>
            <div id="orderList">তথ্য লোড হচ্ছে...</div>
        </div>
    </div>

    <script>
        // সিকিউরিটি পাসওয়ার্ড প্রম্পট
        window.onload = function() {
            let pass = prompt("প্রবেশ করতে এডমিন পাসওয়ার্ড দিন:");
            if (pass === "mahir" || pass === "Mahir98") {
                document.getElementById('adminContainer').style.display = 'block';
                loadAllData();
            } else {
                alert("ভুল পাসওয়ার্ড!");
                document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20vh;'>Access Denied - ভুল পাসওয়ার্ড</h1>";
            }
        };

        // ইমেজ প্রিভিউ ফাংশন
        function previewImg(input, id) {
            const preview = document.getElementById(id);
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // ডাটা লোড করার ফাংশন
        async function loadAllData() {
            try {
                let sRes = await fetch('/settings');
                let s = await sRes.json();
                document.getElementById('insideDhaka').value = s.insideDhaka || 80;
                document.getElementById('outsideDhaka').value = s.outsideDhaka || 150;
            } catch(e) {}

            try {
                let pRes = await fetch('/products');
                let prods = await pRes.json();
                document.getElementById('productList').innerHTML = prods.map(x => `
                    <div class="list-item">
                        <div>
                            <strong>${x.title}</strong><br>
                            <span style="color:#38bdf8;">৳${x.price}</span> | স্ট্যাটাস: ${x.stockStatus} | ছবি: ${(x.images||[]).length}টি
                        </div>
                        <button class="del-btn" onclick="deleteProduct('${x._id}')">ডিলিট</button>
                    </div>
                `).join('') || 'কোনো পণ্য পাওয়া যায়নি।';
            } catch(e) {}

            try {
                let oRes = await fetch('/orders');
                let ords = await oRes.json();
                document.getElementById('orderList').innerHTML = ords.map(o => `
                    <div class="list-item" style="display:block;">
                        গ্রাহক: <strong>${o.customerName}</strong> | ফোন: ${o.phone}<br>
                        পণ্য: ${o.productTitle} - ৳${o.productPrice}<br>
                        ঠিকানা: ${o.address}
                    </div>
                `).join('') || 'কোনো অর্ডার নেই।';
            } catch(e) {}
        }

        // ডেলিভারি চার্জ সাবমিট
        document.getElementById('settingsForm').onsubmit = async (e) => {
            e.preventDefault();
            await fetch('/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    insideDhaka: Number(document.getElementById('insideDhaka').value), 
                    outsideDhaka: Number(document.getElementById('outsideDhaka').value) 
                })
            });
            alert('ডেলিভারি চার্জ সফলভাবে আপডেট হয়েছে!');
        };

        // প্রোডাক্ট আপলোড সাবমিট (৫টি বক্স হ্যান্ডেলিং)
        document.getElementById('addProductForm').onsubmit = async (e) => {
            e.preventDefault();
            
            const fileToBase64 = file => new Promise((resolve) => {
                let reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.readAsDataURL(file);
            });

            let imagesArray = [];
            for (let id of ['img1', 'img2', 'img3', 'img4', 'img5']) {
                let fileInput = document.getElementById(id).files[0];
                if (fileInput) {
                    let base64Data = await fileToBase64(fileInput);
                    imagesArray.push(base64Data);
                }
            }

            if (imagesArray.length === 0) {
                alert('দয়া করে কমপক্ষে একটি ছবি আপলোড করুন!');
                return;
            }

            let response = await fetch('/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    title: document.getElementById('title').value,
                    price: Number(document.getElementById('price').value),
                    oldPrice: document.getElementById('oldPrice').value ? Number(document.getElementById('oldPrice').value) : null,
                    category: document.getElementById('category').value,
                    stockStatus: document.getElementById('stockStatus').value,
                    images: imagesArray,
                    description: document.getElementById('description').value
                })
            });

            if(response.ok) {
                alert('পণ্যটি সফলভাবে ডাটাবেজে যুক্ত হয়েছে!');
                location.reload();
            } else {
                alert('আপলোড করতে সমস্যা হয়েছে!');
            }
        };

        // প্রোডাক্ট ডিলিট ফাংশন
        async function deleteProduct(id) {
            if(confirm('সত্যিই এই পণ্যটি মুছে ফেলতে চান?')) {
                await fetch('/products/' + id, { method: 'DELETE' });
                loadAllData();
            }
        }
    </script>
</body>
</html>
