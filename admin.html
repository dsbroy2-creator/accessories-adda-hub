<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Panel</title>
  <style>
    body{font-family:Arial;margin:0;background:#f5f5f5}
    .top{background:#111;color:#fff;padding:16px}
    .wrap{max-width:1150px;margin:auto;padding:18px}
    .panel,.card{background:#fff;padding:16px;border-radius:12px;margin:12px 0}
    input,textarea,select{width:100%;padding:10px;margin:6px 0 12px;box-sizing:border-box}
    button{padding:10px 15px;border:0;border-radius:7px;background:#111;color:#fff;cursor:pointer}
    .gold{background:#c9a227;color:#111}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}
    .thumb{width:100%;height:160px;object-fit:contain;background:#eee;border-radius:8px}
    .order{border-left:5px solid #c9a227}
  </style>
</head>
<body>
  <div class="top"><h2>Accessories Adda Hub — Admin Panel</h2></div>
  <div class="wrap">
    <div id="login" class="panel">
      <h3>Admin Login</h3>
      <input id="pass" type="password" placeholder="Admin password">
      <button onclick="login()">Login</button>
    </div>
    <div id="app" style="display:none">
      <div class="panel"><button onclick="logout()">Logout</button></div>
      <div class="panel">
        <h3>Store & Payment Settings</h3>
        <input id="tag" placeholder="Tagline">
        <textarea id="del" placeholder="Delivery text"></textarea>
        <input id="wa" placeholder="WhatsApp">
        <input id="bk" placeholder="bKash Merchant/Payment Number">
        <input id="ng" placeholder="Nagad Merchant/Payment Number">
        <button class="gold" onclick="saveSettings()">Save Settings</button>
      </div>
      <div class="panel">
        <h3>New Product</h3>
        <input id="nn" placeholder="Product name">
        <input id="np" type="number" placeholder="Price">
        <textarea id="nd" placeholder="Description"></textarea>
        <input id="ni" type="file" accept="image/*">
        <button class="gold" onclick="addProduct()">Add Product</button>
      </div>
      <h3>Products</h3>
      <div id="plist" class="grid"></div>
      <h3>Orders</h3>
      <div id="olist"></div>
    </div>
  </div>
  <script>
    let token = localStorage.adminToken || "";
    function esc(s){ return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

    async function api(u, o = {}) {
      o.headers = { ...(o.headers || {}), "x-admin-token": token };
      let r = await fetch(u, o);
      if (r.status === 401) { logout(); throw Error("Unauthorized"); }
      return r;
    }

    async function login() {
      let r = await fetch("/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pass.value })
      });
      let d = await r.json();
      if (!r.ok) return alert("Wrong password");
      token = d.token;
      localStorage.adminToken = token;
      show();
    }

    function logout() {
      localStorage.removeItem("adminToken");
      location.reload();
    }

    async function show() {
      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";
      let s = await fetch("/api/settings").then(r => r.json());
      tag.value = s.tagline || "";
      del.value = s.deliveryText || "";
      wa.value = s.whatsapp || "";
      bk.value = s.bkash || "";
      ng.value = s.nagad || "";
      loadP();
      loadO();
    }

    async function saveSettings() {
      await api("/api/admin/settings", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tagline: tag.value, deliveryText: del.value, whatsapp: wa.value, bkash: bk.value, nagad: ng.value })
      });
      alert("Settings saved");
    }

    async function upload(f) {
      let x = new FormData();
      x.append("image", f);
      return (await (await api("/api/admin/upload", { method: "POST", body: x })).json()).url;
    }

    async function loadP() {
      let a = await api("/api/admin/products").then(r => r.json());
      plist.innerHTML = a.map(p => `<div class="card"><img class="thumb" src="${p.image || ''}"><input id="n${p.id}" value="${esc(p.name)}"><input id="p${p.id}" type="number" value="${p.price}"><textarea id="d${p.id}">${esc(p.description)}</textarea><input id="i${p.id}" type="file" accept="image/*"><label><input id="s${p.id}" type="checkbox" ${p.stock ? "checked" : ""}> Available</label><button class="gold" onclick="saveP('${p.id}')">Save</button> <button onclick="delP('${p.id}')">Delete</button></div>`).join("");
    }

    async function saveP(id) {
      let f = document.getElementById("i" + id).files[0];
      let body = {
        name: document.getElementById("n" + id).value,
        price: document.getElementById("p" + id).value,
        description: document.getElementById("d" + id).value,
        stock: document.getElementById("s" + id).checked
      };
      if (f) body.image = await upload(f);
      await api("/api/admin/products/" + id, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      loadP();
    }

    async function addProduct() {
      let u = ni.files[0] ? await upload(ni.files[0]) : "";
      await api("/api/admin/products", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: nn.value, price: np.value, description: nd.value, image: u }) });
      nn.value = np.value = nd.value = "";
      ni.value = "";
      loadP();
    }

    async function delP(id) {
      if (confirm("Delete product?")) {
        await api("/api/admin/products/" + id, { method: "DELETE" });
        loadP();
      }
    }

    async function loadO() {
      let a = await api("/api/admin/orders").then(r => r.json());
      olist.innerHTML = a.length ? a.map(o => `<div class="card order"><b>${o.id}</b><p><b>${esc(o.customer ? o.customer.name : '')}</b> | ${esc(o.customer ? o.customer.phone : '')}<br>${esc(o.customer ? o.customer.address : '')}</p></div>`).join("") : "<p>No orders yet</p>";
    }

    if (token) show();
  </script>
</body>
</html>
